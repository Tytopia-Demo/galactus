name: "Frogbot Security Scan"

on:
  pull_request_target: 
    types: [opened, synchronize]
  push:
    branches:
      - master
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: write
  security-events: write

jobs:
  frogbot-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Log workflow start time
        run: |
          echo "Workflow started at: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          echo "Runner: $(uname -a)"
          echo "CPU cores: $(nproc)"
          echo "Memory: $(free -h | grep Mem | awk '{print $2}')"

      - uses: jfrog/frogbot@v2
        env:
          JF_URL: ${{ secrets.JF_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
          JF_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JF_GIT_BASE_BRANCH: master

      - name: Log resource usage
        if: always()
        run: |
          echo "Workflow completed at: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          echo "CPU usage during workflow:"
          top -bn1 | head -n 20
          echo "Memory usage:"
          free -h
          echo "Disk usage:"
          df -h
